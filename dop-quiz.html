<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOP 対策 一問一答</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel2:#f0f2f5; --line:#dfe3e8;
  --text:#1b1f24; --muted:#6b7280; --accent:#2f6feb; --accent-soft:#e8f0fe;
  --ok:#12855b; --ok-soft:#e3f6ee; --ng:#c9333d; --ng-soft:#fdeaec;
  --warn:#b7791f; --warn-soft:#fdf3e2; --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14171c; --panel:#1c2027; --panel2:#242a33; --line:#333a45;
    --text:#e7eaee; --muted:#9aa4b2; --accent:#6d9bff; --accent-soft:#22314f;
    --ok:#4ade9a; --ok-soft:#16342a; --ng:#ff7b86; --ng-soft:#3a1f24;
    --warn:#f0c060; --warn-soft:#3a2f18;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;
  font-size:15px;line-height:1.7;}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);}
.hd{max-width:900px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:700;font-size:16px;letter-spacing:.02em;white-space:nowrap}
.logo span{color:var(--accent)}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav button{background:transparent;border:1px solid transparent;color:var(--muted);padding:6px 12px;
  border-radius:8px;cursor:pointer;font-size:14px;font-family:inherit}
nav button:hover{background:var(--panel2);color:var(--text)}
nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
main{max-width:900px;margin:0 auto;padding:18px 16px 80px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px}
h2{font-size:16px;margin:0 0 12px}
h3{font-size:14px;margin:18px 0 8px;color:var(--muted);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--accent);color:#fff;border:none;padding:9px 18px;border-radius:9px;
  cursor:pointer;font-size:14px;font-weight:600;font-family:inherit}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sub{background:var(--panel2);color:var(--text);border:1px solid var(--line);font-weight:500}
.btn.sm{padding:5px 11px;font-size:13px;font-weight:500}
select,input[type=text]{background:var(--panel2);color:var(--text);border:1px solid var(--line);
  border-radius:8px;padding:7px 10px;font-size:14px;font-family:inherit}
label.f{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}

/* --- 出題 --- */
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tag{font-size:11.5px;padding:2px 9px;border-radius:99px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.tag.dom{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tag.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag.ng{background:var(--ng-soft);color:var(--ng);border-color:transparent}
.tag.mk{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.qtext{font-size:16px;line-height:1.85;white-space:pre-wrap;margin:6px 0 4px}
.qen{font-size:13.5px;color:var(--muted);white-space:pre-wrap;margin:10px 0 0;padding-top:10px;border-top:1px dashed var(--line)}
.hint{font-size:13px;color:var(--muted);margin:10px 0 6px}
.choices{display:flex;flex-direction:column;gap:8px;margin:12px 0 0}
.ch{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border:1px solid var(--line);
  border-radius:10px;background:var(--panel2);cursor:pointer;transition:.12s;user-select:none}
.ch:hover{border-color:var(--accent)}
.ch.sel{border-color:var(--accent);background:var(--accent-soft)}
.ch.rev-ok{border-color:var(--ok);background:var(--ok-soft)}
.ch.rev-ng{border-color:var(--ng);background:var(--ng-soft)}
.ch.rev-miss{border-style:dashed;border-color:var(--ok)}
.ch .key{flex:0 0 26px;height:26px;border-radius:7px;background:var(--panel);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:var(--muted)}
.ch.sel .key{background:var(--accent);color:#fff;border-color:transparent}
.ch.rev-ok .key{background:var(--ok);color:#fff;border-color:transparent}
.ch.rev-ng .key{background:var(--ng);color:#fff;border-color:transparent}
.ch .txt{flex:1;white-space:pre-wrap}
.ch .mark{font-size:12px;color:var(--muted);align-self:center}
.verdict{margin-top:16px;padding:14px 16px;border-radius:10px;border:1px solid var(--line)}
.verdict.ok{background:var(--ok-soft);border-color:var(--ok)}
.verdict.ng{background:var(--ng-soft);border-color:var(--ng)}
.vhead{font-size:17px;font-weight:700;margin-bottom:6px}
.verdict.ok .vhead{color:var(--ok)} .verdict.ng .vhead{color:var(--ng)}
.exp{white-space:pre-wrap;font-size:14.5px}
.refs{margin-top:10px;font-size:13px;color:var(--muted)}
.refs a{color:var(--accent)}
.foot{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;align-items:center}
.pager{display:inline-flex;align-items:center;gap:4px}
.pg{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);
  color:var(--text);cursor:pointer;font-size:15px;line-height:1;font-family:inherit;padding:0}
.pg:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.pg:disabled{opacity:.3;cursor:not-allowed}
.pagerbar{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px}
.spacer{flex:1}
.pill{font-size:12.5px;color:var(--muted)}

/* --- 一覧 --- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12.5px;white-space:nowrap}
tr.clickable:hover{background:var(--panel2);cursor:pointer}
.qcell{max-width:420px}
.trunc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* --- 統計 --- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat .n{font-size:24px;font-weight:700;line-height:1.2}
.stat .l{font-size:12px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;margin-top:5px}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar>i.low{background:var(--ng)} .bar>i.mid{background:var(--warn)} .bar>i.high{background:var(--ok)}
.dom-row{margin-bottom:12px}
.dom-row .t{display:flex;justify-content:space-between;font-size:13.5px}
.empty{color:var(--muted);text-align:center;padding:34px 10px}
code{background:var(--panel2);padding:2px 6px;border-radius:5px;font-size:13px}
.note{font-size:13px;color:var(--muted);line-height:1.8}
</style>
</head>
<body>
<header>
  <div class="hd">
    <div class="logo">DOP <span>一問一答</span></div>
    <nav>
      <button data-v="quiz" class="on">演習</button>
      <button data-v="list">問題一覧</button>
      <button data-v="stats">統計</button>
      <button data-v="data">データ</button>
    </nav>
  </div>
</header>
<main>
  <div id="view-quiz"></div>
  <div id="view-list" hidden></div>
  <div id="view-stats" hidden></div>
  <div id="view-data" hidden></div>
</main>

<script>
/* ==========================================================================
   問題データ  ここに問題を追加していきます
   --------------------------------------------------------------------------
   type: "single" = 単一選択 / "multi" = 複数選択 / "order" = 並び替え
   answer: single→["B"] / multi→["B","D"](順不同) / order→["C","A","B"](この順序が正解)
   ========================================================================== */
const QUESTIONS = [
  {
    id: "Q001",
    domain: "モニタリングとロギング",
    type: "single",
    question: "ある企業は、アプリケーションロードバランサー（ALB）に対して HTTP API 呼び出しを行うモバイルアプリケーションを所有しています。ALB はリクエストを AWS Lambda 関数にルーティングします。アプリケーションには、一部のユーザーによるテスト中のバージョンを含め、常にさまざまなバージョンが使用されています。アプリケーションのバージョンは、API へのすべてのリクエストとともに送信される user-agent ヘッダーで定義されます。\n最近の一連の API 変更の後、同社はアプリケーションに問題が発生していることを確認しました。同社は、使用されているアプリケーションの各バージョンについて、応答コードごとに各 API 操作のメトリクスを収集する必要があります。DevOps エンジニアは、API 操作名、user-agent ヘッダーからのバージョン情報、および応答コードを抽出するように Lambda 関数を変更しました。\n\n必要なメトリクスを収集するために、DevOps エンジニアは他にどのようなアクションを実行する必要がありますか？",
    questionEn: "",
    choices: [
      { id:"A", text:"Lambda 関数を変更して、API 操作名、レスポンスコード、バージョン番号をログ行として Amazon CloudWatch Logs ロググループに書き込むようにします。各 API 操作名ごとにメトリクスをインクリメントする CloudWatch Logs メトリクスフィルタを設定します。メトリクスのディメンションとして、レスポンスコードとアプリケーションバージョンを指定します。" },
      { id:"B", text:"Lambda 関数を変更して、API 操作名、レスポンスコード、バージョン番号をログ行として Amazon CloudWatch Logs ロググループに書き込むようにします。CloudWatch Logs Insights クエリを設定して、ログ行から CloudWatch メトリクスを取得します。メトリクスのディメンションとして、レスポンスコードとアプリケーションバージョンを指定します。" },
      { id:"C", text:"ALB アクセスログを Amazon CloudWatch Logs ロググループに書き込むように設定します。Lambda 関数を変更して、API 操作名、応答コード、バージョン番号を応答メタデータとして ALB に応答するようにします。各 API 操作名に対してメトリクスをインクリメントする CloudWatch Logs メトリクスフィルタを設定します。メトリクスのディメンションとして、応答コードとアプリケーションバージョンを指定します。" },
      { id:"D", text:"Lambda 関数で AWS X-Ray の統合を設定します。Lambda 関数を変更して、API 操作名、応答コード、およびバージョン番号を含む X-Ray サブセグメントを作成します。X-Ray Insights を設定して、各 API 操作名に対して集計メトリクスを抽出し、そのメトリクスを Amazon CloudWatch に公開します。メトリクスのディメンションとして、応答コードとアプリケーションバージョンを指定します。" }
    ],
    answer: ["A"],
    explanation: "【正解 A】\nCloudWatch Logs の「メトリクスフィルタ」は、ロググループに書き込まれたログ行をパターンでフィルタし、一致した行をカスタムメトリクスとしてカウント（インクリメント）できます。さらにメトリクスフィルタでは、ログ行から抽出した値を最大 3 つまでディメンションとして指定できるため、「API 操作名のメトリクス × 応答コード × アプリケーションバージョン」という要件をそのまま満たせます。\nLambda 関数はすでに 3 つの値を抽出済みなので、あとは構造化ログ（JSON など）として CloudWatch Logs に出力し、メトリクスフィルタを設定するだけで完結します。\n\n【誤りの選択肢】\nB: CloudWatch Logs Insights は「その場でログをクエリして結果を見る」ための機能で、クエリ結果を継続的な CloudWatch メトリクスとして自動発行する仕組みではありません。ダッシュボードやアラームで使う恒常的なメトリクスは作れません。\n\nC: ALB のアクセスログは S3 バケットにのみ配信され、CloudWatch Logs へ直接書き込む設定はできません。また ALB アクセスログには Lambda が返した「応答メタデータ」は記録されないため、バージョン情報を取り出せません。\n\nD: X-Ray Insights は異常検知（anomaly detection）の機能であり、任意のサブセグメント属性から集計メトリクスを抽出して CloudWatch に公開する機能ではありません。要件に対して機能の使い方が誤っています。\n\n【覚えるポイント】\n・ログ行 → 継続的なカスタムメトリクス = CloudWatch Logs メトリクスフィルタ（ディメンション最大3つ）\n・Logs Insights = アドホックな調査用クエリ。メトリクス化はしない\n・ALB / CloudFront / S3 のアクセスログ = 配信先は S3",
    refs: [
      { label:"CloudWatch Logs メトリクスフィルタでディメンションを使用する", url:"https://docs.aws.amazon.com/ja_jp/AmazonCloudWatch/latest/logs/CountOccurrencesExample.html" },
      { label:"ALB のアクセスログ（配信先は S3）", url:"https://docs.aws.amazon.com/ja_jp/elasticloadbalancing/latest/application/load-balancer-access-logs.html" }
    ]
  },
  {
    id: "Q002",
    domain: "耐障害性の高いクラウドソリューション",
    type: "single",
    question: "ある企業が顧客にアプリケーションを提供しています。このアプリケーションには、AWS Lambda 関数を呼び出す Amazon API Gateway REST API があります。初期化時に、Lambda 関数は Amazon DynamoDB テーブルから大量のデータをロードします。このデータロード処理により、コールドスタート時間が 8〜10 秒と長くなります。DynamoDB テーブルには DynamoDB Accelerator (DAX) が構成されています。\n顧客からは、アプリケーションがリクエストへの応答に断続的に時間がかかるという報告があります。アプリケーションは 1 日を通して数千件のリクエストを受け取ります。日中は、他の時間帯の 10 倍のリクエストが発生します。1 日の終わり近くになると、アプリケーションのリクエスト量は通常の合計の 10% に減少します。\nDevOps エンジニアは、1 日を通して Lambda 関数のレイテンシを削減する必要があります。\n\nこれらの要件を満たすソリューションはどれですか？",
    questionEn: "",
    choices: [
      { id:"A", text:"Lambda 関数で、同時実行数を 1 に設定してプロビジョニングされた同時実行を構成します。DynamoDB テーブルの DAX クラスターを削除します。" },
      { id:"B", text:"Lambda 関数の同時実行予約を、同時実行値 0 で設定します。" },
      { id:"C", text:"Lambda 関数でプロビジョニングされた同時実行数を設定します。Lambda 関数で AWS Application Auto Scaling を設定し、プロビジョニングされた同時実行数の値を最小 1、最大 100 に設定します。" },
      { id:"D", text:"Lambda 関数で予約済み同時実行数を設定します。API Gateway API で AWS Application Auto Scaling を設定し、予約済み同時実行数の最大値を 100 に設定します。" }
    ],
    answer: ["C"],
    explanation: "【正解 C】\n問題の本質は「初期化に 8〜10 秒かかるコールドスタート」です。これを解消する AWS の標準機能が **プロビジョニングされた同時実行 (Provisioned Concurrency)** です。実行環境を事前に初期化済みの状態で待機させるため、初期化コード（DynamoDB からの大量データロード）がリクエスト到達時には完了しており、コールドスタートが発生しません。\nさらに本問はトラフィックの変動が大きい（日中は他の時間帯の 10 倍、夜間は 10%）という条件があります。固定値では日中に不足し、夜間は無駄なコストになります。そこで **Application Auto Scaling** をプロビジョニングされた同時実行に適用し、最小 1・最大 100 の範囲で自動的にスケールさせることで、1 日を通してレイテンシを抑えられます。\n\n【誤りの選択肢】\nA: プロビジョニングされた同時実行を 1 に固定すると、日中のピーク時に大半のリクエストがコールドスタートになります。また DAX の削除は DynamoDB の読み取りを遅くするだけで、レイテンシ改善に逆行します。\n\nB: 予約済み同時実行 (Reserved Concurrency) を 0 にすると、関数の呼び出しがすべてスロットリングされ、関数が実行できなくなります。完全に逆効果です。\n\nD: 予約済み同時実行は「その関数が使える同時実行数の上限を確保する」機能であり、実行環境を温めておく機能ではないためコールドスタートは解消しません。また Application Auto Scaling は API Gateway の予約済み同時実行を対象にできません（設定対象が誤り）。\n\n【覚えるポイント】\n・Provisioned Concurrency（プロビジョニングされた同時実行）= 実行環境を事前初期化 → **コールドスタート対策**。Application Auto Scaling で min/max を設定可能\n・Reserved Concurrency（予約済み同時実行）= 同時実行数の**枠の確保・上限設定**。0 にすると呼び出し停止（緊急停止用途）\n・「コールドスタートが長い」と出たら、まず Provisioned Concurrency を疑う",
    refs: [
      { label:"Lambda のプロビジョニングされた同時実行の設定", url:"https://docs.aws.amazon.com/ja_jp/lambda/latest/dg/provisioned-concurrency.html" },
      { label:"Lambda の予約済み同時実行", url:"https://docs.aws.amazon.com/ja_jp/lambda/latest/dg/configuration-concurrency.html" }
    ]
  },
  {
    id: "Q003",
    domain: "SDLC の自動化",
    type: "single",
    question: "ある企業が、Java-Apache Tomcat アプリケーションと Apache Web サーバーを用いたアプリケーションデプロイを自動化するために、AWS CodeDeploy を採用しています。開発チームはまず概念実証を行い、開発環境用のデプロイグループを作成し、アプリケーション内で機能テストを実施しました。テスト完了後、ステージング環境と本番環境用にデプロイグループを追加作成する予定です。\n現在のログレベルは Apache の設定で構成されていますが、デプロイ時にこの構成を動的に変更することで、デプロイグループごとに異なるログレベル構成を設定できるようにしたいと考えています。各デプロイグループごとに異なるスクリプトバージョンを用意することなく、管理オーバーヘッドを最小限に抑えつつ、これらの要件を満たすにはどうすればよいでしょうか？",
    questionEn: "",
    choices: [
      { id:"A", text:"Amazon EC2 インスタンスに、デプロイメントグループに応じたタグを付けます。次に、メタデータサービスと EC2 API を呼び出してインスタンスがどのデプロイメントグループに属しているかを識別するスクリプトをアプリケーションリビジョンに配置します。この情報を使用してログレベルの設定を構成します。appspec.yml ファイルの AfterInstall ライフサイクルフックの一部として、このスクリプトを参照します。" },
      { id:"B", text:"CodeDeploy 環境変数 DEPLOYMENT_GROUP_NAME を使用して、インスタンスが属するデプロイメントグループを識別するスクリプトを作成します。この情報を使用してログレベルの設定を構成します。appspec.yml ファイルの BeforeInstall ライフサイクルフックの一部として、このスクリプトを参照します。" },
      { id:"C", text:"各環境ごとに CodeDeploy のカスタム環境変数を作成します。次に、この環境変数をチェックしてインスタンスがどのデプロイメントグループに属しているかを識別するスクリプトをアプリケーションリビジョンに配置します。この情報を使用してログレベルの設定を構成します。appspec.yml ファイルの ValidateService ライフサイクルフックの一部として、このスクリプトを参照します。" },
      { id:"D", text:"CodeDeploy 環境変数 DEPLOYMENT_GROUP_ID を使用して、インスタンスが属するデプロイメントグループを識別し、ログレベルの設定を構成するスクリプトを作成します。このスクリプトを appspec.yml ファイルの Install ライフサイクルフックの一部として参照します。" }
    ],
    answer: ["B"],

    question: "ある e コマース企業から、注文履歴ページに注文処理状況が反映されるのに遅延が発生しているという報告を受けています。注文処理システムは、予約済み同時実行を使用する AWS Lambda 関数で構成されています。この Lambda 関数は、Amazon Simple Queue Service（Amazon SQS）キューから注文メッセージを処理し、処理済みの注文を Amazon DynamoDB テーブルに挿入します。DynamoDB テーブルでは、読み取りと書き込みの容量について自動スケーリングが有効になっています。\n\nこの遅延を解消するために、DevOps エンジニアはどのような対策を講じるべきでしょうか？（2 つ選択してください）",
    questionEn: "",
    choices: [
      { id:"A", text:"SQS キューの ApproximateAgeOfOldestMessage メトリクスを確認してください。Lambda 関数の同時実行制限を増やしてください。" },
      { id:"B", text:"SQS キューの ApproximateAgeOfOldestMessage メソッドを確認し、SQS キューで再ドライブポリシーを設定します。" },
      { id:"C", text:"SQS キューの NumberOfMessagesSent メトリクスを確認します。SQS キューの可視性タイムアウトを延長します。" },
      { id:"D", text:"DynamoDB テーブルの WriteThrottleEvents メトリクスを確認します。テーブルのスケーリングポリシーの最大書き込み容量ユニット（WCU）を増やします。" },
      { id:"E", text:"Lambda 関数の Throttles メトリクスを確認します。Lambda 関数のタイムアウトを長くします。" }
    ],
    answer: ["A","D"],
    explanation: "【正解 A・D】\n遅延の原因は、処理パイプラインの「詰まっている箇所」を特定して広げることで解消します。本問では 2 つのボトルネック候補があります。\n\n**A: Lambda 側のボトルネック**\n`ApproximateAgeOfOldestMessage`（キュー内で最も古いメッセージの滞留時間）は、**消費が生産に追いついていない**ことを示す代表的なメトリクスです。この値が伸びている場合、**予約済み同時実行の値が処理能力の上限になっている**可能性が高いため、同時実行制限を引き上げて並列処理数を増やします。\n\n**D: DynamoDB 側のボトルネック**\n`WriteThrottleEvents` は書き込みがスロットリングされた回数を示します。Auto Scaling が有効でも、**スケーリングポリシーの上限（最大 WCU）に張り付いている**とそれ以上スケールできません。書き込みがスロットルされると Lambda 側でリトライが発生し、結果としてキューの滞留と遅延につながります。上限 WCU を引き上げるのが対策です。\n\n【誤りの選択肢】\nB: 再ドライブポリシー（**デッドレターキューの設定**）は、処理に繰り返し失敗したメッセージを隔離するための仕組みです。**スループットは上がらず、遅延の解消にはなりません。** また「メトリクス」ではなく「メソッド」と書かれている点も誤りです。\n\nC: `NumberOfMessagesSent` は**キューに送信されたメッセージ数**であり、滞留の指標にはなりません。また可視性タイムアウトの延長は「処理中のメッセージが他のコンシューマーに見えない時間」を延ばすだけで、処理速度は上がりません（むしろ失敗時の再処理が遅くなります）。\n\nE: `Throttles` の確認自体は有効ですが、対策が誤りです。**スロットリングは同時実行数の不足が原因**なので、引き上げるべきは同時実行数であってタイムアウトではありません。タイムアウトは 1 回の実行が長引く場合の設定です。\n\n【覚えるポイント】\n・**SQS の滞留を見るメトリクスは `ApproximateAgeOfOldestMessage`**（+ `ApproximateNumberOfMessagesVisible`）。「処理が追いついていない」の指標\n・**Lambda の `Throttles` → 同時実行数を上げる**。タイムアウトの調整では解決しない\n・**DynamoDB の `WriteThrottleEvents` / `ReadThrottleEvents` → 容量不足**。Auto Scaling 有効でも**上限値**に達していれば頭打ちになる\n・DLQ（再ドライブポリシー）は**失敗メッセージの隔離**であり、性能改善策ではない",
    refs: [
      { label:"Amazon SQS の CloudWatch メトリクス", url:"https://docs.aws.amazon.com/ja_jp/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-available-cloudwatch-metrics.html" },
      { label:"DynamoDB Auto Scaling", url:"https://docs.aws.amazon.com/ja_jp/amazondynamodb/latest/developerguide/AutoScaling.html" }
    ]
  },
  {

    type: "single",
    question: "ある企業は、単一の AWS リージョンで数百の Amazon EC2 インスタンスを実行する単一の AWS アカウントを所有しています。このアカウントでは、1 時間ごとに新しい EC2 インスタンスが起動および終了します。また、このアカウントには、1 週間以上実行されている既存の EC2 インスタンスも含まれています。\n企業のセキュリティポリシーでは、実行中のすべての EC2 インスタンスに EC2 インスタンスプロファイルを使用することが義務付けられています。インスタンスプロファイルがアタッチされていない EC2 インスタンスは、IAM 権限が割り当てられていないデフォルトのインスタンスプロファイルを使用する必要があります。\nDevOps エンジニアがアカウントをレビューしたところ、インスタンスプロファイルなしで実行されている EC2 インスタンスが見つかりました。レビュー中に、DevOps エンジニアは、インスタンスプロファイルなしで新しい EC2 インスタンスが起動されていることも確認しました。\n\nリージョン内の既存および将来のすべての EC2 インスタンスにインスタンスプロファイルがアタッチされるようにするには、どのソリューションを使用すればよいでしょうか？",
    questionEn: "",
    choices: [

      { id:"B", text:"ec2-instance-profile-attached AWS Config マネージドルールを、設定変更をトリガータイプとして設定します。AWS Systems Manager Automation ランブックを呼び出してデフォルトのインスタンスプロファイルを EC2 インスタンスにアタッチする自動修復アクションを設定します。" },
      { id:"C", text:"EC2 StartInstances API 呼び出しに反応する Amazon EventBridge ルールを設定します。ルールを設定して、AWS Systems Manager Automation ランブックを呼び出し、デフォルトのインスタンスプロファイルを EC2 インスタンスにアタッチします。" },
      { id:"D", text:"設定変更をトリガータイプとして、AWS Config マネージドルール iam-role-managed-policy-check を設定します。AWS Lambda 関数を呼び出してデフォルトのインスタンスプロファイルを EC2 インスタンスにアタッチする自動修復アクションを設定します。" }

    answer: ["B"],
    explanation: "【正解 B】\n要件は「**既存**および**将来**のすべての EC2 インスタンス」をカバーすることです。ここが最大の判断ポイントになります。\n\nAWS Config には **ec2-instance-profile-attached** というマネージドルールがあり、EC2 インスタンスにインスタンスプロファイルがアタッチされているかを評価します。\n・トリガータイプを「**設定変更**」にすると、新しく起動したインスタンスも即座に評価されます\n・AWS Config は**設定した時点で既存のリソースも評価**するため、1 週間以上前から動いているインスタンスもカバーできます\n・**自動修復アクション**に SSM Automation ランブックを設定すれば、非準拠を検出した際にデフォルトのインスタンスプロファイルを自動でアタッチできます\n\n【誤りの選択肢】\nA: `RunInstances` イベントに反応する構成は**新規に起動されるインスタンスしかカバーできません。** すでに実行中の既存インスタンスは永久に修復されず、要件の半分しか満たせません。\n\nC: `StartInstances` は**停止していたインスタンスを開始する API** です。新規起動（RunInstances）でも既存の実行中インスタンスでもないため、カバー範囲がさらに狭くなります。\n\nD: **`iam-role-managed-policy-check` は「指定した管理ポリシーが IAM ロールにアタッチされているか」を確認するルール**であり、EC2 インスタンスプロファイルの有無とは無関係です。ルール名が要件と噛み合っていません。\n\n【覚えるポイント】\n・**「既存 + 将来のすべて」と書かれたら AWS Config**（既存リソースも評価対象）。EventBridge はイベント発生時のみで既存分を拾えない\n・EC2 インスタンスプロファイルの準拠チェック = マネージドルール **ec2-instance-profile-attached**\n・検出 → 自動修正の型: **AWS Config ルール + 修復アクション（SSM Automation ランブック）**\n・`RunInstances`（新規起動）と `StartInstances`（停止からの再開）は別物。混同しやすい",
    refs: [

  {
    id: "Q014",
    domain: "SDLC の自動化",
    type: "single",
    question: "DevOps エンジニアが、AWS Lambda 関数を使用するサーバーレスアプリケーションの継続的デプロイメントパイプラインを構築しています。同社は、デプロイメントの失敗による顧客への影響を最小限に抑えたいと考えています。また、問題の監視も行いたいと考えています。\n\nこれらの要件を満たすデプロイメントステージ構成はどれでしょうか？",
    questionEn: "",
    choices: [
      { id:"A", text:"AWS Serverless Application Model (AWS SAM) テンプレートを使用して、サーバーレスアプリケーションを定義します。AWS CodeDeploy を使用して、デプロイ設定タイプを Canary10Percent15Minutes に設定し、Lambda 関数をデプロイします。Amazon CloudWatch アラームを使用して、関数の健全性を監視します。" },
      { id:"B", text:"AWS CloudFormation を使用して新しいスタックの更新を公開し、すべてのリソースに Amazon CloudWatch アラームを含めます。開発者が AWS CloudFormation の変更セットを検証および承認するための AWS CodePipeline 承認アクションを設定します。" },
      { id:"C", text:"AWS CloudFormation を使用して、スタックの更新ごとに新しいバージョンを公開し、すべてのリソースに Amazon CloudWatch アラームを含めます。スタックの更新中にトラフィックルーティングを更新するには、AWS::Lambda::Alias リソースの RoutingConfig プロパティを使用します。" },
      { id:"D", text:"AWS CodeBuild を使用して、テスト用のサンプルイベントペイロードを Lambda 関数に追加します。関数の新しいバージョンを公開し、Amazon CloudWatch アラームを含めます。本番環境のエイリアスを更新して、新しいバージョンを指すようにします。アラームが ALARM 状態になったときにロールバックが発生するように設定します。" }
    ],
    answer: ["A"],
    explanation: "【正解 A】\n「デプロイ失敗の顧客影響を最小化」＋「問題の監視」という 2 つの要件を、**AWS SAM + CodeDeploy の段階的デプロイ（Gradual Deployment）**が一括で満たします。\n\nSAM テンプレートの `AutoPublishAlias` と `DeploymentPreference` を設定すると、CodeDeploy が Lambda エイリアスの**加重ルーティング**を自動的に制御します。`Canary10Percent15Minutes` は「まず新バージョンに 10% のトラフィックを流し、15 分間問題がなければ残り 90% を切り替える」という設定で、**問題があっても影響を受けるのは 10% のユーザーだけ**です。\nさらに `Alarms` プロパティに CloudWatch アラームを指定すれば、**デプロイ中にアラームが発報した時点で自動的に旧バージョンへロールバック**されます。監視と安全なデプロイが 1 つの仕組みで実現できるため、これが最適解です。\n\n【誤りの選択肢】\nB: **CodePipeline の手動承認アクションは人間の確認を挟むだけ**で、デプロイ後の障害から顧客を守る仕組みではありません。変更セットの承認後に一括切り替えが行われるため、問題があれば全ユーザーに影響します。「顧客への影響を最小限に」という要件を満たしません。\n\nC: `AWS::Lambda::Alias` の `RoutingConfig` を使えば加重ルーティング自体は可能ですが、**トラフィックの割合を段階的に増やす制御も、アラーム発報時の自動ロールバックも自前で実装する必要があります。** CloudFormation スタック更新の中では自動的に進行しないため、要件を満たすには運用負荷が大きすぎます。\n\nD: **エイリアスを新バージョンに一括で切り替えており、段階的な移行になっていません。** 問題が起きた瞬間に全ユーザーが影響を受けます。また「アラーム発報時にロールバック」の部分も自前実装が必要です。\n\n【覚えるポイント】\n・**Lambda の安全なデプロイ = SAM の `DeploymentPreference` + CodeDeploy**（内部でエイリアスの加重ルーティングを制御）\n・デプロイ設定タイプの型を覚える\n　- `Canary10Percent15Minutes` … 10% を流して 15 分待ち、問題なければ全量\n　- `Linear10PercentEvery10Minutes` … 10 分ごとに 10% ずつ増やす\n　- `AllAtOnce` … 一括切り替え（段階的でない）\n・`Alarms` プロパティ = **デプロイ中にアラームが発報したら自動ロールバック**。これが「監視」要件への回答\n・SAM では `AutoPublishAlias` を指定することでバージョン発行とエイリアス更新が自動化される",
    refs: [
      { label:"AWS SAM: Lambda アプリケーションの段階的デプロイ", url:"https://docs.aws.amazon.com/ja_jp/serverless-application-model/latest/developerguide/automating-updates-to-serverless-apps.html" },
      { label:"CodeDeploy: Lambda のデプロイ設定", url:"https://docs.aws.amazon.com/ja_jp/codedeploy/latest/userguide/deployment-configurations.html#deployment-configuration-lambda" }
    ]

  {

      { id:"D", text:"アプリケーションインスタンス用のセキュリティグループを作成し、アーティファクトリポジトリへの送信トラフィックのみを許可するように設定します。インストールが完了したら、セキュリティグループのルールを削除します。" }

    explanation: "【正解 C】\n要件は「**インターネットにアクセスできない状態で実行する**」ことです。同時に、起動時にはアーティファクトを取得する必要があります。この 2 つを両立させるのが **S3 用の VPC エンドポイント（ゲートウェイエンドポイント）** です。\nVPC エンドポイントを使うと、EC2 からの S3 へのトラフィックは**インターネットゲートウェイや NAT を経由せず、AWS 内部のネットワークだけで完結**します。インスタンスはインターネットに一切出ないまま、アーティファクトをダウンロードできます。\nあわせて EC2 に IAM インスタンスプロファイルを割り当てれば、認証済みで S3 から取得でき、アクセスキーも不要です。\n\n【誤りの選択肢】\nA: インストール中は Elastic IP を付けており、**その間はインターネットにアクセスできる状態**になっています。要件に反しますし、後から外すという運用も脆弱です。\n\nB: **NAT ゲートウェイはプライベートサブネットからインターネットへ出るための仕組み**です。プライベートサブネットに置いても、NAT 経由でインターネットにアクセスできてしまうため「インターネットにアクセスできない状態」という要件を満たしません。\n\nD: **セキュリティグループはアウトバウンドを絞るだけで、経路そのものはインターネット経由のまま**です。また「インストール後にルールを削除する」という運用は、Auto Scaling などで新しいインスタンスが起動するたびに破綻します。\n\n【覚えるポイント】\n・**「インターネットにアクセスさせずに AWS サービスを使う」= VPC エンドポイント**\n　- **ゲートウェイエンドポイント**（無料）… S3、DynamoDB のみ。ルートテーブルにエントリが追加される\n　- **インターフェイスエンドポイント（PrivateLink）**… その他多数のサービス。ENI が作られ、時間課金\n・**NAT ゲートウェイはインターネットに出る仕組み**。「インターネット遮断」の要件では誤答になる\n・セキュリティグループでの制限は「経路を変える」ものではない\n・プライベート環境で SSM Session Manager や CodeDeploy を使う場合も、同様にインターフェイスエンドポイントが必要になる",

/* ---------------- ストレージ ---------------- */
const SKEY = "dop-quiz-v1";
const DEFAULT_DB = { version:1, stats:{}, settings:{ showEn:false } };
let DB = load();

function load(){
  try{
    const raw = localStorage.getItem(SKEY);
    if(!raw) return structuredClone(DEFAULT_DB);
    const d = JSON.parse(raw);
    return Object.assign(structuredClone(DEFAULT_DB), d);
  }catch(e){ return structuredClone(DEFAULT_DB); }
}
function save(){ try{ localStorage.setItem(SKEY, JSON.stringify(DB)); }catch(e){} }
function st(qid){
  if(!DB.stats[qid]) DB.stats[qid] = { log:[], mark:0 };   // mark: 0=なし 1=★重要 2=要復習
  return DB.stats[qid];
}
function rec(qid, ok){ st(qid).log.push({ t:Date.now(), ok:!!ok }); save(); }
function summary(qid){
  const s = st(qid), log = s.log;
  const n = log.length, c = log.filter(x=>x.ok).length;
  let streak = 0;
  for(let i=log.length-1;i>=0;i--){ if(log[i].ok) streak++; else break; }
  return { n, c, wrong:n-c, rate: n? Math.round(c/n*100) : null, last: n? log[n-1].ok : null, streak, mark:s.mark };
}
const MARK_LABEL = { 1:"★ 重要", 2:"要復習" };

/* ---------------- ユーティリティ ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"]/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[m]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const eqSet = (a,b) => a.length===b.length && a.every(x=>b.includes(x));
const eqSeq = (a,b) => a.length===b.length && a.every((x,i)=>x===b[i]);
const domains = () => [...new Set(QUESTIONS.map(q=>q.domain).filter(Boolean))];
const TYPE_LABEL = { single:"単一選択", multi:"複数選択", order:"並び替え" };

/* ---------------- 出題プール ---------------- */
let session = { pool:[], idx:0, sel:[], revealed:false, order:[], correctCount:0, doneCount:0 };
let filter = { domain:"", mode:"all", shuffleQ:false, shuffleC:false };

function buildPool(){
  let list = QUESTIONS.filter(q=>!filter.domain || q.domain===filter.domain);
  const m = filter.mode;
  if(m==="unanswered") list = list.filter(q=>summary(q.id).n===0);
  if(m==="wrong")      list = list.filter(q=>summary(q.id).wrong>0);
  if(m==="lastwrong")  list = list.filter(q=>summary(q.id).last===false);
  if(m==="mark1")      list = list.filter(q=>summary(q.id).mark===1);
  if(m==="mark2")      list = list.filter(q=>summary(q.id).mark===2);
  if(m==="weak")       list = list.filter(q=>{const s=summary(q.id); return s.n>0 && s.rate<70;});
  return filter.shuffleQ ? shuffle(list) : list;
}
function startSession(){
  session = { pool:buildPool(), idx:0, sel:[], revealed:false, order:[], correctCount:0, doneCount:0 };
  renderQuiz();
}
function gotoQuestion(qid){
  const i = session.pool.findIndex(q=>q.id===qid);
  if(i>=0){
    session.idx = i;
  } else {
    // 現在の出題プールに含まれない問題は、全問題プールに切り替えてジャンプ
    session.pool = QUESTIONS.slice();
    session.idx = Math.max(0, session.pool.findIndex(q=>q.id===qid));
  }
  session.sel=[]; session.order=[]; session.revealed=false;
  switchView("quiz"); renderQuiz();
}
/* 「3」「Q003」「q3」などの入力を問題へ解決してジャンプ */
function jumpTo(raw){
  const s = String(raw||"").trim();
  if(!s) return;
  const up = s.toUpperCase();
  // 1) ID 完全一致
  let q = QUESTIONS.find(x=>x.id.toUpperCase()===up);
  // 2) 数字だけ → ID 内の数字が一致するもの（Q003 ⇔ 3）
  if(!q){
    const n = parseInt(s.replace(/[^0-9]/g,""),10);
    if(!isNaN(n)){
      q = QUESTIONS.find(x=>{
        const m = x.id.match(/(\d+)/);
        return m && parseInt(m[1],10)===n;
      });
      // 3) それでも無ければ、現在の出題順の n 番目
      if(!q && n>=1 && n<=session.pool.length) q = session.pool[n-1];
    }
  }
  if(!q){ alert(`「${s}」に一致する問題が見つかりません。\n問題番号（例: 3）または ID（例: Q003）を入力してください。`); return; }
  gotoQuestion(q.id);
}

/* ---------------- 演習ビュー ---------------- */

  const el = $("#view-quiz");
  const ctrl = quizControls();

  if(!session.pool.length){

    bindControls(); return;
  }
  if(session.idx >= session.pool.length){
    const rate = session.doneCount? Math.round(session.correctCount/session.doneCount*100):0;
    el.innerHTML = ctrl + `<div class="card"><h2>セッション終了</h2>
      <div class="grid">
        <div class="stat"><div class="n">${session.doneCount}</div><div class="l">回答数</div></div>
        <div class="stat"><div class="n" style="color:var(--ok)">${session.correctCount}</div><div class="l">正解</div></div>
        <div class="stat"><div class="n" style="color:var(--ng)">${session.doneCount-session.correctCount}</div><div class="l">不正解</div></div>
        <div class="stat"><div class="n">${rate}%</div><div class="l">正答率</div></div>
      </div>
      <div class="foot"><button class="btn" id="again">もう一周</button>
      <button class="btn sub" id="againWrong">間違えた問題だけ</button></div></div>`;
    bindControls();
    $("#again").onclick = startSession;
    $("#againWrong").onclick = ()=>{ filter.mode="lastwrong"; $("#f-mode").value="lastwrong"; startSession(); };
    return;
  }

  const q = session.pool[session.idx];
  const s = summary(q.id);
  const R = session.revealed;
  const need = q.type==="multi" ? (q.pick || q.answer.length) : 1;

  const hist = s.n ? `<span class="tag ${s.last?'ok':'ng'}">直近 ${s.last?'○':'×'}</span>
      <span class="tag">${s.c}/${s.n}　${s.rate}%</span>${s.streak>1?`<span class="tag ok">${s.streak}連続正解</span>`:""}`
    : `<span class="tag">未回答</span>`;

  let hint = "";
  if(q.type==="multi") hint = `${need} つ選択してください`;
  else if(q.type==="order") hint = "正しい順序になるようにクリックして番号を付けてください";
  else hint = "1 つ選択してください";

  let choicesHtml = "";
  const chs = filter.shuffleC && q.type!=="order" ? shuffle(q.choices) : q.choices;
  if(q.type==="order"){
    chs.forEach(c=>{
      const pos = session.order.indexOf(c.id);
      let cls = "ch" + (pos>=0 ? " sel":"");
      let key = pos>=0 ? (pos+1) : "・";
      if(R){
        const correctPos = q.answer.indexOf(c.id);
        cls = "ch " + (pos===correctPos ? "rev-ok":"rev-ng");
        key = (correctPos+1);
      }
      choicesHtml += `<div class="${cls}" data-id="${c.id}"><div class="key">${key}</div>
        <div class="txt">${esc(c.text)}</div>${R && pos>=0 && pos!==q.answer.indexOf(c.id)?`<div class="mark">あなた: ${pos+1}</div>`:""}</div>`;
    });
  } else {
    chs.forEach(c=>{
      const sel = session.sel.includes(c.id);
      const isAns = q.answer.includes(c.id);
      let cls = "ch" + (sel?" sel":"");
      let mark = "";
      if(R){
        if(isAns && sel){ cls="ch rev-ok"; mark="正解"; }
        else if(isAns && !sel){ cls="ch rev-miss"; mark="正解（未選択）"; }
        else if(!isAns && sel){ cls="ch rev-ng"; mark="あなたの選択"; }
        else cls="ch";
      }
      choicesHtml += `<div class="${cls}" data-id="${c.id}"><div class="key">${c.id}</div>
        <div class="txt">${esc(c.text)}</div>${mark?`<div class="mark">${mark}</div>`:""}</div>`;
    });
  }

  let verdict = "";
  if(R){
    const ok = isCorrect(q);
    const ansStr = q.type==="order" ? q.answer.join(" → ") : q.answer.join(", ");
    verdict = `<div class="verdict ${ok?'ok':'ng'}">
      <div class="vhead">${ok?"○ 正解":"× 不正解"}　<span style="font-size:13px;font-weight:500;color:var(--muted)">正解: ${ansStr}</span></div>
      ${q.explanation?`<div class="exp">${esc(q.explanation)}</div>`:""}
      ${(q.refs&&q.refs.length)?`<div class="refs">参考: ${q.refs.map(r=>`<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.label||r.url)}</a>`).join(" / ")}</div>`:""}
    </div>`;
  }

  const markBtns = `
    <button class="btn sm ${s.mark===1?'':'sub'}" data-mark="1" style="${s.mark===1?'background:var(--warn);border-color:transparent;color:#fff':''}">★ 重要</button>
    <button class="btn sm ${s.mark===2?'':'sub'}" data-mark="2" style="${s.mark===2?'background:var(--ng);border-color:transparent;color:#fff':''}">要復習</button>`;

  el.innerHTML = ctrl + `<div class="card">
    <div class="qmeta">
      <span class="pager">
        <button class="pg" id="navPrev" ${session.idx===0?"disabled":""} title="前の問題 (←)">‹</button>
        <span class="pill" style="min-width:52px;text-align:center">${session.idx+1} / ${session.pool.length}</span>
        <button class="pg" id="navNext" ${session.idx+1>=session.pool.length?"disabled":""} title="次の問題 (→)">›</button>
      </span>
      ${q.domain?`<span class="tag dom">${esc(q.domain)}</span>`:""}
      <span class="tag">${TYPE_LABEL[q.type]||q.type}</span>
      ${s.mark?`<span class="tag mk">${MARK_LABEL[s.mark]}</span>`:""}
      ${hist}
      <span class="pill" style="margin-left:auto">${esc(q.id)}</span>
    </div>
    <div class="qtext">${esc(q.question)}</div>
    ${(q.questionEn && DB.settings.showEn)?`<div class="qen">${esc(q.questionEn)}</div>`:""}
    <div class="hint">${hint}${q.type==="order"&&session.order.length?` <button class="btn sm sub" id="clearOrder">順序をクリア</button>`:""}</div>
    <div class="choices" id="choices">${choicesHtml}</div>
    ${verdict}
    <div class="foot">
      ${markBtns}
      ${q.questionEn?`<button class="btn sm sub" id="toggleEn">${DB.settings.showEn?"英文を隠す":"英文を表示"}</button>`:""}
      <div class="spacer"></div>
      ${!R?`<button class="btn" id="submit" ${canSubmit(q)?"":"disabled"}>回答する</button>`
           :`<button class="btn" id="next">${session.idx+1>=session.pool.length?"結果を見る":"次の問題 →"}</button>`}
    </div>
  </div>
  <div class="pagerbar">
    <button class="btn sub" id="navPrevB" ${session.idx===0?"disabled":""}>← 前の問題</button>
    <span class="pill">${session.idx+1} / ${session.pool.length}　（${esc(q.id)}）</span>
    <button class="btn sub" id="navNextB" ${session.idx+1>=session.pool.length?"disabled":""}>次の問題 →</button>
  </div>`;

  bindControls();
  $("#choices").querySelectorAll(".ch").forEach(d=>{
    if(R) return;
    d.onclick = ()=> pick(q, d.dataset.id);
  });
  el.querySelectorAll("[data-mark]").forEach(b=>{
    b.onclick = ()=>{ const v=+b.dataset.mark; const o=st(q.id); o.mark = o.mark===v?0:v; save(); renderQuiz(); };
  });
  if($("#toggleEn")) $("#toggleEn").onclick = ()=>{ DB.settings.showEn=!DB.settings.showEn; save(); renderQuiz(); };
  if($("#clearOrder")) $("#clearOrder").onclick = ()=>{ session.order=[]; renderQuiz(); };
  if($("#submit")) $("#submit").onclick = ()=> doSubmit(q);
  if($("#next")) $("#next").onclick = ()=> nextQ();
  if($("#skip")) $("#skip").onclick = ()=> nextQ();
  if($("#prev")) $("#prev").onclick = ()=> prevQ();
  if($("#navPrev")) $("#navPrev").onclick = ()=> prevQ();
  if($("#navNext")) $("#navNext").onclick = ()=> nextQ();
  if($("#navPrevB")) $("#navPrevB").onclick = ()=> prevQ();
  if($("#navNextB")) $("#navNextB").onclick = ()=> nextQ();
}

function pick(q, id){
  if(q.type==="single"){ session.sel=[id]; }
  else if(q.type==="multi"){
    const need = q.pick || q.answer.length;
    const i = session.sel.indexOf(id);
    if(i>=0) session.sel.splice(i,1);
    else { if(session.sel.length>=need) session.sel.shift(); session.sel.push(id); }
  } else {
    const i = session.order.indexOf(id);
    if(i>=0) session.order.splice(i,1); else session.order.push(id);
  }
  renderQuiz();
}
function canSubmit(q){
  if(q.type==="order") return session.order.length===q.choices.length;
  if(q.type==="multi") return session.sel.length===(q.pick||q.answer.length);
  return session.sel.length===1;
}
function isCorrect(q){
  if(q.type==="order") return eqSeq(session.order, q.answer);
  return eqSet(session.sel, q.answer);
}
function doSubmit(q){
  if(!canSubmit(q)) return;
  const ok = isCorrect(q);
  rec(q.id, ok);
  session.revealed = true;
  session.doneCount++; if(ok) session.correctCount++;
  renderQuiz();
}
function nextQ(){
  session.idx++; session.sel=[]; session.order=[]; session.revealed=false;
  renderQuiz();
}
function prevQ(){
  if(session.idx<=0) return;
  session.idx--; session.sel=[]; session.order=[]; session.revealed=false;
  renderQuiz();
}

function quizControls(){
  const doms = domains();
  const counts = { all:QUESTIONS.length };
  return `<div class="card">
    <div class="row">
      <label class="f">出題範囲
        <select id="f-mode">
          <option value="all">すべて (${QUESTIONS.length})</option>
          <option value="unanswered">未回答 (${QUESTIONS.filter(q=>summary(q.id).n===0).length})</option>
          <option value="wrong">一度でも間違えた (${QUESTIONS.filter(q=>summary(q.id).wrong>0).length})</option>
          <option value="lastwrong">直近が× (${QUESTIONS.filter(q=>summary(q.id).last===false).length})</option>
          <option value="weak">正答率70%未満 (${QUESTIONS.filter(q=>{const s=summary(q.id);return s.n>0&&s.rate<70;}).length})</option>
          <option value="mark1">★重要 (${QUESTIONS.filter(q=>summary(q.id).mark===1).length})</option>
          <option value="mark2">要復習 (${QUESTIONS.filter(q=>summary(q.id).mark===2).length})</option>
        </select>
      </label>
      <label class="f">ドメイン
        <select id="f-dom"><option value="">すべて</option>${doms.map(d=>`<option value="${esc(d)}">${esc(d)}</option>`).join("")}</select>
      </label>
      <label class="f">&nbsp;
        <span class="row">
          <label style="font-size:13px;display:flex;gap:5px;align-items:center;cursor:pointer"><input type="checkbox" id="f-sq"> 問題順シャッフル</label>
          <label style="font-size:13px;display:flex;gap:5px;align-items:center;cursor:pointer"><input type="checkbox" id="f-sc"> 選択肢シャッフル</label>
        </span>
      </label>
      <label class="f">問題番号へジャンプ
        <span class="row">
          <input type="text" id="f-jump" placeholder="3 / Q003" style="width:100px">
          <button class="btn sm sub" id="jumpBtn">移動</button>
        </span>
      </label>
      <div class="spacer"></div>
      <label class="f">&nbsp;<button class="btn" id="start">開始 / リセット</button></label>
    </div>
  </div>`;
}
function bindControls(){
  const m=$("#f-mode"), d=$("#f-dom"), sq=$("#f-sq"), sc=$("#f-sc"), b=$("#start");
  if(!m) return;
  m.value=filter.mode; d.value=filter.domain; sq.checked=filter.shuffleQ; sc.checked=filter.shuffleC;
  m.onchange=()=>{filter.mode=m.value;}; d.onchange=()=>{filter.domain=d.value;};
  sq.onchange=()=>{filter.shuffleQ=sq.checked;}; sc.onchange=()=>{filter.shuffleC=sc.checked;};
  b.onclick=startSession;
  const j=$("#f-jump"), jb=$("#jumpBtn");
  if(j){
    jb.onclick = ()=> jumpTo(j.value);
    j.onkeydown = e=>{ if(e.key==="Enter"){ e.preventDefault(); e.stopPropagation(); jumpTo(j.value); } };
  }
}

/* ---------------- 問題一覧 ---------------- */
function renderList(){
  const rows = QUESTIONS.map(q=>{
    const s = summary(q.id);
    const rate = s.rate===null? "—" : s.rate+"%";
    const last = s.n? (s.last?'<span style="color:var(--ok)">○</span>':'<span style="color:var(--ng)">×</span>') : "—";
    return `<tr class="clickable" data-id="${esc(q.id)}">
      <td style="white-space:nowrap">${esc(q.id)}</td>
      <td class="qcell"><div class="trunc">${esc(q.question)}</div></td>
      <td style="white-space:nowrap">${esc(q.domain||"—")}</td>
      <td style="white-space:nowrap">${TYPE_LABEL[q.type]||q.type}</td>
      <td style="text-align:center">${last}</td>
      <td style="white-space:nowrap">${s.c}/${s.n}　${rate}</td>
      <td style="white-space:nowrap">${s.mark?MARK_LABEL[s.mark]:"—"}</td>
    </tr>`;
  }).join("");
  $("#view-list").innerHTML = `<div class="card">
    <h2>問題一覧（${QUESTIONS.length}問）</h2>
    <div class="note">行をクリックするとその問題を演習できます。</div>
    <div style="overflow-x:auto;margin-top:10px">
    <table><thead><tr><th>ID</th><th>問題</th><th>ドメイン</th><th>形式</th><th>直近</th><th>正解/回答</th><th>マーク</th></tr></thead>
    <tbody>${rows||`<tr><td colspan="7" class="empty">問題がありません</td></tr>`}</tbody></table></div></div>`;
  $("#view-list").querySelectorAll("tr.clickable").forEach(tr=>tr.onclick=()=>gotoQuestion(tr.dataset.id));
}

/* ---------------- 統計 ---------------- */
function renderStats(){
  let n=0,c=0,answered=0;
  QUESTIONS.forEach(q=>{ const s=summary(q.id); n+=s.n; c+=s.c; if(s.n) answered++; });
  const rate = n? Math.round(c/n*100):0;

  const byDom = domains().map(d=>{
    const qs = QUESTIONS.filter(q=>q.domain===d);
    let dn=0,dc=0; qs.forEach(q=>{const s=summary(q.id); dn+=s.n; dc+=s.c;});
    return { d, qs:qs.length, n:dn, c:dc, rate: dn? Math.round(dc/dn*100):null };
  });

  const weak = QUESTIONS.map(q=>({q,s:summary(q.id)}))
    .filter(x=>x.s.n>0 && x.s.rate<100)
    .sort((a,b)=> a.s.rate-b.s.rate || b.s.wrong-a.s.wrong).slice(0,20);

  const cls = r => r>=80?"high": r>=60?"mid":"low";

  $("#view-stats").innerHTML = `
  <div class="card"><h2>全体</h2>
    <div class="grid">
      <div class="stat"><div class="n">${QUESTIONS.length}</div><div class="l">総問題数</div></div>
      <div class="stat"><div class="n">${answered}</div><div class="l">回答済み問題</div></div>
      <div class="stat"><div class="n">${n}</div><div class="l">のべ回答数</div></div>
      <div class="stat"><div class="n" style="color:var(--${rate>=80?'ok':rate>=60?'warn':'ng'})">${rate}%</div><div class="l">通算正答率</div></div>
    </div>
  </div>
  <div class="card"><h2>ドメイン別</h2>
    ${byDom.length? byDom.map(x=>`<div class="dom-row">
      <div class="t"><span>${esc(x.d)} <span style="color:var(--muted)">(${x.qs}問)</span></span>
      <span style="color:var(--muted)">${x.rate===null?"未回答":x.c+"/"+x.n+"　"+x.rate+"%"}</span></div>
      <div class="bar"><i class="${x.rate===null?'':cls(x.rate)}" style="width:${x.rate||0}%"></i></div>
    </div>`).join("") : `<div class="empty">データがありません</div>`}
  </div>
  <div class="card"><h2>弱点の問題（正答率が低い順・上位20）</h2>
    ${weak.length? `<div style="overflow-x:auto"><table>
      <thead><tr><th>ID</th><th>問題</th><th>正解/回答</th><th>正答率</th><th>直近</th><th>マーク</th></tr></thead>
      <tbody>${weak.map(x=>`<tr class="clickable" data-id="${esc(x.q.id)}">
        <td style="white-space:nowrap">${esc(x.q.id)}</td>
        <td class="qcell"><div class="trunc">${esc(x.q.question)}</div></td>
        <td style="white-space:nowrap">${x.s.c}/${x.s.n}</td>
        <td style="color:var(--${cls(x.s.rate)==='high'?'ok':cls(x.s.rate)==='mid'?'warn':'ng'})">${x.s.rate}%</td>
        <td>${x.s.last?'○':'×'}</td>
        <td>${x.s.mark?MARK_LABEL[x.s.mark]:"—"}</td></tr>`).join("")}</tbody></table></div>`
      : `<div class="empty">まだ弱点データがありません</div>`}
  </div>`;
  $("#view-stats").querySelectorAll("tr.clickable").forEach(tr=>tr.onclick=()=>gotoQuestion(tr.dataset.id));
}

/* ---------------- データ ---------------- */
function renderData(){
  $("#view-data").innerHTML = `<div class="card">
    <h2>学習履歴のバックアップ</h2>
    <div class="note">履歴・マークはこのブラウザの localStorage に保存されます。ブラウザのデータを消すと失われるため、時々エクスポートしておくと安全です。</div>
    <div class="foot"><button class="btn" id="exp">エクスポート (JSON)</button>
      <button class="btn sub" id="imp">インポート</button>
      <input type="file" id="impf" accept="application/json,.json" hidden>
      <div class="spacer"></div>
      <button class="btn sub" id="reset" style="color:var(--ng)">履歴をすべて削除</button></div>
  </div>
  <div class="card"><h2>問題の追加方法</h2>
    <div class="note">このファイルをテキストエディタで開き、<code>const QUESTIONS = [ ... ]</code> の中に問題オブジェクトを追加してください。<br>
    <code>type</code> は <code>"single"</code>（単一選択）、<code>"multi"</code>（複数選択・<code>pick</code>で選ぶ数を指定）、<code>"order"</code>（並び替え・<code>answer</code>が正しい順序）です。<br>
    <code>id</code> をそのままにしておけば、問題文を修正しても学習履歴は引き継がれます。</div>
  </div>`;
  $("#exp").onclick = ()=>{
    const blob = new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    const d=new Date(), p=x=>String(x).padStart(2,"0");
    a.href=URL.createObjectURL(blob);
    a.download=`dop-quiz-history-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.json`;
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  };
  $("#imp").onclick = ()=> $("#impf").click();
  $("#impf").onchange = e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const d=JSON.parse(r.result);
        if(!d || typeof d.stats!=="object") throw 0;
        DB = Object.assign(structuredClone(DEFAULT_DB), d);
        save(); alert("インポートしました。"); renderData(); renderList(); renderStats();
      }catch(err){ alert("読み込めませんでした。エクスポートした JSON ファイルを選んでください。"); }
    };
    r.readAsText(f); e.target.value="";
  };
  $("#reset").onclick = ()=>{
    if(confirm("すべての学習履歴とマークを削除します。よろしいですか？")){
      DB = structuredClone(DEFAULT_DB); save(); renderData(); renderList(); renderStats(); startSession();
    }
  };
}

/* ---------------- ビュー切替 ---------------- */
function switchView(v){
  ["quiz","list","stats","data"].forEach(x=>{ $("#view-"+x).hidden = (x!==v); });
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on", b.dataset.v===v));
  if(v==="list") renderList();
  if(v==="stats") renderStats();
  if(v==="data") renderData();
}
document.querySelectorAll("nav button").forEach(b=> b.onclick=()=>switchView(b.dataset.v));

/* ---------------- キーボード ---------------- */
document.addEventListener("keydown", e=>{
  if($("#view-quiz").hidden) return;
  if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT") return;
  const q = session.pool[session.idx]; if(!q) return;
  if(e.key==="Enter"){
    e.preventDefault();
    if(session.revealed) nextQ(); else if(canSubmit(q)) doSubmit(q);
    return;
  }
  if(e.key==="ArrowLeft"){ e.preventDefault(); prevQ(); return; }
  if(e.key==="ArrowRight"){ e.preventDefault(); if(session.idx+1<session.pool.length) nextQ(); return; }
  if(session.revealed) return;
  const n = parseInt(e.key,10);
  if(n>=1 && n<=9 && q.choices[n-1]) pick(q, q.choices[n-1].id);
  const up = e.key.toUpperCase();
  if(/^[A-Z]$/.test(up) && q.choices.some(c=>c.id===up)) pick(q, up);
});

/* ---------------- 起動 ---------------- */
startSession();
</script>
